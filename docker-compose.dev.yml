version: '3.8'

services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0-preview
    container_name: minibilling-backend-dev
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/billing.db;Cache=Shared
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    ports:
      - "5000:5000"
    command: dotnet watch run --urls http://0.0.0.0:5000
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: minibilling-frontend-dev
    working_dir: /app
    volumes:
      - ./ClientApp:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
